name: CI

# Typecheck and tests. Deploys are handled by Cloudflare Workers Builds on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # tests use node:sqlite (22.5+)
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
